<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>글쓰기 스튜디오</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--sub:#6b7280;--line:#e3e6ec;--brand:#2f5bea;--brand2:#e8eefe;--ok:#14803c;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--panel:#1a1f2a;--ink:#e8ebf2;--sub:#98a1b3;--line:#2a3140;--brand:#6d8cff;--brand2:#222c4a;--ok:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex}
button,select,input,textarea{font:inherit;color:inherit}
aside{width:210px;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;overflow:auto}
aside h1{font-size:16px;margin:4px 8px 12px}
.nav{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--bg)}.nav.on{background:var(--brand2);color:var(--brand);font-weight:600}
.sep{height:1px;background:var(--line);margin:8px 4px}
main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:auto;padding:16px;gap:14px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top h2{margin:0;font-size:18px}.top .desc{color:var(--sub);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:380px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:13px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;align-items:center}
textarea{width:100%;flex:1;min-height:220px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;background:transparent;line-height:1.7}
.drop{outline:2px dashed var(--brand)}
.out{flex:1;min-height:220px;white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;line-height:1.75}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--brand)}.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:wait}
select,input[type=text],input[type=password]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--brand2);color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.h{cursor:pointer}tr.h:hover{background:var(--bg)}th{color:var(--sub);font-weight:600}
.news li{margin-bottom:10px;list-style:none}.news ul{padding:0;margin:0}.news a{color:var(--brand);text-decoration:none;font-weight:600}.news small{color:var(--sub)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(640px,94vw);padding:18px}
dialog::backdrop{background:#0006}dialog label{display:block;margin:10px 0 4px;font-size:13px;color:var(--sub)}dialog input,dialog textarea{width:100%}dialog textarea{min-height:90px}
.err{color:#dc2626}.hide{display:none!important}
@media(max-width:820px){body{flex-direction:column;height:auto;min-height:100vh}aside{width:100%;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}aside h1,.sep{display:none}.nav{width:auto;white-space:nowrap}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside id="nav"></aside>
<main>
  <div class="top"><h2 id="title"></h2><span class="desc" id="desc"></span><span style="flex:1"></span><span class="chip" id="state"></span></div>

  <div id="newsView" class="card news hide">
    <div class="row"><input type="text" id="kw" placeholder="키워드 (쉼표로 구분) 예: 전자상거래, 물류, 마케팅" style="flex:1;min-width:220px"><button class="btn pri" id="kwGo">기사 수집</button><button class="btn" id="kwSave">키워드 저장</button></div>
    <div id="newsList">키워드를 저장하면 이 화면을 열 때마다 최신 기사를 자동으로 모읍니다.</div>
  </div>

  <div id="workView">
    <div class="grid">
      <div class="card" id="inCard">
        <h3><span>입력 · 직접 쓰기 / 파일 드래그 / 링크 붙여넣기</span><span class="row"><button class="btn sm" id="fetchUrl">링크 본문 가져오기</button><button class="btn sm" id="clearIn">비우기</button></span></h3>
        <textarea id="input" placeholder="주제만 적어도 되고, 고칠 글을 붙여넣어도 됩니다. .txt/.md 파일을 끌어다 놓거나 URL을 붙여넣고 '링크 본문 가져오기'를 누르세요."></textarea>
        <div class="row" id="opts"></div>
        <div class="row" id="actions"></div>
      </div>
      <div class="card">
        <h3><span>결과</span><span class="row"><button class="btn sm" id="copy">복사</button><button class="btn sm" id="toIn">← 입력으로 보내기</button></span></h3>
        <div class="out" id="out" contenteditable="plaintext-only" spellcheck="false">결과가 여기에 표시됩니다.</div>
        <div class="row" style="font-size:12px;color:var(--sub)">결과를 직접 클릭해서 고칠 수 있고, 아래에서 AI에게 추가 수정을 요청할 수 있습니다.</div>
        <div class="row" id="chips"><button class="btn sm" data-r="더 짧게 줄여줘">더 짧게</button><button class="btn sm" data-r="더 구체적인 사례·숫자를 넣어줘">더 구체적으로</button><button class="btn sm" data-r="톤을 더 부드럽고 친근하게 바꿔줘">부드럽게</button><button class="btn sm" data-r="첫 문장(훅)을 더 강하게 바꿔줘">훅 강화</button><button class="btn sm" data-r="마지막 마무리 문장을 바꿔줘">마무리 변경</button></div>
        <div class="row"><input type="text" id="refine" placeholder="추가 수정 요청 (예: 2번 문단을 빼고 더 단호하게)" style="flex:1;min-width:180px"><button class="btn pri" id="refineGo">수정 반영</button><button class="btn" id="undo" disabled>되돌리기</button></div>
        <div id="imgBox" class="hide"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3><span>작업 기록 (날짜 · 요청 · 결과 — 클릭하면 그때 작업 복원)</span><span class="row"><button class="btn sm" id="exp">백업 내보내기</button><button class="btn sm" id="imp">가져오기</button><button class="btn sm" id="clr">이 메뉴 기록 삭제</button></span></h3>
    <div style="overflow:auto;max-height:260px"><table><thead><tr><th style="width:130px">날짜</th><th style="width:90px">작업</th><th>요청내용</th><th>결과물</th></tr></thead><tbody id="hist"></tbody></table></div>
  </div>
</main>

<dialog id="dlg">
  <h3 style="margin-top:0">설정</h3>
  <label>Claude API 키 (이 브라우저에만 저장, 서버로 전송 안 됨)</label><input type="password" id="sKey" placeholder="sk-ant-...">
  <label>모델</label><input type="text" id="sModel">
  <label>내 프로필 · 말투 (모든 글에 반영)</label><textarea id="sProfile"></textarea>
  <label>글 관련 이미지 — 이미지 서비스 사용 (켜면 프롬프트로 미리보기 이미지를 불러옵니다)</label><select id="sImg"><option value="1">사용</option><option value="0">사용 안 함 (프롬프트만)</option></select>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="sCancel">닫기</button><button class="btn pri" id="sSave">저장</button></div>
</dialog>
<input type="file" id="file" accept=".json" class="hide">

<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const DEF_PROFILE="나는 실무 경험을 가진 직장인. 말투: 담백하고 구체적, 과장·낚시 표현 금지, 실무 경험과 숫자 중심. (⚙️ 설정에서 내 정보로 바꿔주세요)";
const cfg=Object.assign({key:"",model:"claude-sonnet-5-5",profile:DEF_PROFILE,img:"1",kw:""},LS.get("cfg",{}));
let history=LS.get("hist",[]);

const CATS={
 linkedin:{icon:"💼",name:"링크드인 글쓰기",desc:"전문가 톤의 링크드인 포스트",modes:["작성","수정","검사"],
  sys:"너는 링크드인 전문 에디터다. 첫 두 줄에 스크롤을 멈추게 하는 훅, 짧은 문단(1~2문장), 구체적 사례·숫자, 마지막에 생각을 묻는 한 줄. 해시태그는 3개 이하. 1,300자 안팎. 한국어.",
  opts:[["tone","톤",["담백·전문","스토리텔링","인사이트 요약","도발적 질문"]]]},
 threads:{icon:"🧵",name:"쓰레드 글쓰기",desc:"짧고 대화체인 Threads 글",modes:["작성","수정","검사"],
  sys:"너는 Threads 글 에디터다. 한 글 500자 이내, 구어체, 한 가지 메시지. 길면 1/ 2/ 3/ 형태의 연결 글로 나눠라. 해시태그 불필요. 한국어.",
  opts:[["tone","톤",["가볍고 친근","공감","정보 전달","유머"]]]},
 translate:{icon:"🌐",name:"업무용 영어 번역",desc:"비즈니스 이메일·메신저용",modes:["한→영","영→한","검사"],
  sys:"너는 비즈니스 커뮤니케이션 번역가다. 자연스럽고 정중한 업무 영어로 옮기고, 마지막에 '--- 참고' 아래 핵심 표현/뉘앙스 선택 이유를 2~3줄로 적어라. 한→영일 땐 짧은 대안 버전(더 캐주얼)도 1개 덧붙여라.",
  opts:[["tone","격식",["표준 비즈니스","매우 격식","친근한 동료"]],["kind","형태",["이메일","메신저/슬랙","보고/제안"]]]},
 official:{icon:"📄",name:"공문 관련",desc:"공문·공식 문서 작성/검수",modes:["작성","수정","검사"],
  sys:"너는 공문서 작성 전문가다. 두괄식, 격식체(~합니다/~바랍니다), 제목·수신·본문(목적-내용-요청)·붙임 구조. 모호한 표현 금지. 빠진 정보는 [  ]로 비워 표시한다.",
  opts:[["kind","문서 종류",["협조요청","안내/공지","회신","제안서 송부","사과·시정"]]]},
 news:{icon:"📰",name:"관련 기사 모음",desc:"내 키워드 뉴스 자동 수집",modes:[],sys:"",opts:[]},
 image:{icon:"🖼️",name:"글 관련 이미지",desc:"글에 어울리는 이미지 프롬프트·미리보기",modes:["작성"],
  sys:"너는 아트 디렉터다. 입력된 글의 핵심 메시지에 맞는 이미지 아이디어 3개를 제시하라. 각각 '컨셉 한 줄 + 영어 이미지 프롬프트(스타일·구도·색감 포함, 텍스트 글자 없음)'. 마지막에 가장 추천하는 번호를 'BEST: n'으로 표기.",
  opts:[["kind","스타일",["미니멀 일러스트","실사 사진","플랫 벡터","3D 렌더"]]]},
 check:{icon:"✅",name:"글검사",desc:"맞춤법·논리·톤·AI티 점검",modes:["검사"],
  sys:"너는 까다로운 편집장이다. 아래 형식으로 점검하라: 1) 맞춤법·띄어쓰기 오류(원문→수정), 2) 문장 흐름·논리 허점, 3) 과장·근거 없는 주장, 4) AI가 쓴 듯한 상투 표현, 5) 총평 100점 만점 점수와 가장 먼저 고칠 3가지, 6) 수정본 전문.",
  opts:[]}
};
const MODE_P={"작성":"[작성] 아래 주제/자료로 새 글을 써줘.","수정":"[수정] 아래 글을 내 의도를 살려 다듬어줘. 바뀐 핵심 포인트를 마지막에 3줄로 요약.","검사":"[검사] 아래 글을 점검해줘. 문제점과 수정본을 보여줘.","한→영":"[한→영] 아래를 영어로 번역해줘.","영→한":"[영→한] 아래를 자연스러운 한국어로 번역해줘."};
let versions=[];
let cur=LS.get("cur","linkedin");

function save(){LS.set("cfg",cfg);LS.set("hist",history)}
function buildNav(){
 $("#nav").innerHTML="<h1>✍️ 글쓰기 스튜디오</h1>"+Object.entries(CATS).map(([k,c])=>`<button class="nav ${k===cur?"on":""}" data-k="${k}">${c.icon} ${c.name}</button>`).join("")+`<div class="sep"></div><button class="nav" id="setBtn">⚙️ 설정</button>`;
 document.querySelectorAll(".nav[data-k]").forEach(b=>b.onclick=()=>{cur=b.dataset.k;LS.set("cur",cur);render()});
 $("#setBtn").onclick=openSet;
}
function render(){
 buildNav();const c=CATS[cur];
 $("#title").textContent=c.icon+" "+c.name;$("#desc").textContent=c.desc;
 const isNews=cur==="news";
 $("#newsView").classList.toggle("hide",!isNews);$("#workView").classList.toggle("hide",isNews);
 $("#state").textContent=cfg.key?"AI 연결됨":"API 키 필요 (⚙️ 설정)";
 $("#opts").innerHTML=c.opts.map(([id,l,vals])=>`<label>${l} <select data-o="${id}">${vals.map(v=>`<option>${v}</option>`).join("")}</select></label>`).join("");
 $("#actions").innerHTML=c.modes.map((m,i)=>`<button class="btn ${i===0?"pri":""}" data-m="${m}">${m}</button>`).join("");
 document.querySelectorAll("#actions button").forEach(b=>b.onclick=()=>run(b.dataset.m));
 $("#imgBox").classList.add("hide");$("#out").textContent="결과가 여기에 표시됩니다.";versions=[];$("#undo").disabled=true;
 if(isNews){$("#kw").value=cfg.kw;if(cfg.kw)loadNews()}
 renderHist();
}
function renderHist(){
 const rows=history.filter(h=>h.cat===cur);
 $("#hist").innerHTML=rows.length?rows.map(h=>`<tr class="h" data-id="${h.id}"><td>${new Date(h.t).toLocaleString("ko-KR",{dateStyle:"short",timeStyle:"short"})}</td><td>${esc(h.mode)}</td><td>${esc(h.input.slice(0,60))}${h.input.length>60?"…":""}</td><td>${esc(h.output.slice(0,70))}…</td></tr>`).join(""):`<tr><td colspan=4 style="color:var(--sub)">아직 기록이 없습니다.</td></tr>`;
 document.querySelectorAll("tr.h").forEach(r=>r.onclick=()=>{const h=history.find(x=>x.id==r.dataset.id);$("#input").value=h.input;setOut(h.output,true);showImg(h.output)});
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

async function claude(system,user){
 if(!cfg.key)throw new Error("설정(⚙️)에서 Claude API 키를 먼저 입력하세요.");
 const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:cfg.model,max_tokens:4096,system,messages:[{role:"user",content:user}]})});
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
 return j.content.map(b=>b.text||"").join("");
}
async function run(mode){
 const text=$("#input").value.trim();if(!text){$("#out").textContent="입력을 먼저 해주세요.";return}
 const c=CATS[cur];const o=[...document.querySelectorAll("[data-o]")].map(s=>`${s.previousSibling?.textContent||s.dataset.o}: ${s.value}`).join(" / ");
 const sys=c.sys+"\n\n[작성자 프로필]\n"+cfg.profile;
 const btns=document.querySelectorAll("#actions button");btns.forEach(b=>b.disabled=true);$("#out").textContent="작성 중…";
 try{
  const out=await claude(sys,`${MODE_P[mode]}\n${o?"옵션 → "+o+"\n":""}\n${text}`);
  setOut(out,true);showImg(out);
  history.unshift({id:Date.now(),t:Date.now(),cat:cur,mode,input:text,output:out});history=history.slice(0,300);save();renderHist();
 }catch(e){$("#out").innerHTML=`<span class="err">오류: ${esc(e.message)}</span>`}
 btns.forEach(b=>b.disabled=false);
}
function setOut(t,fresh){
 if(fresh)versions=[];else versions.push($("#out").innerText);
 $("#out").textContent=t;$("#undo").disabled=!versions.length;
}
async function refine(req){
 req=(req||$("#refine").value).trim();const cur_=$("#out").innerText.trim();
 if(!req){return}if(!cur_||cur_.startsWith("결과가 여기에")||cur_.startsWith("오류")){$("#out").textContent="먼저 결과를 만든 뒤 추가 수정을 요청하세요.";return}
 const btns=document.querySelectorAll("#refineGo,#chips button,#actions button");btns.forEach(b=>b.disabled=true);
 const before=cur_;$("#refineGo").textContent="수정 중…";
 try{
  const out=await claude(CATS[cur].sys+"\n\n[작성자 프로필]\n"+cfg.profile,`아래 [현재 결과]를 다음 요청대로만 수정해줘. 요청하지 않은 부분은 유지하고, 설명 없이 수정된 전체 글만 출력해.\n\n[요청]\n${req}\n\n[원래 입력]\n${$("#input").value}\n\n[현재 결과]\n${before}`);
  setOut(out,false);showImg(out);$("#refine").value="";
  history.unshift({id:Date.now(),t:Date.now(),cat:cur,mode:"추가수정",input:"추가수정: "+req,output:out});history=history.slice(0,300);save();renderHist();
 }catch(e){alert("오류: "+e.message)}
 btns.forEach(b=>b.disabled=false);$("#refineGo").textContent="수정 반영";$("#undo").disabled=!versions.length;
}
$("#refineGo").onclick=()=>refine();
$("#refine").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)refine()});
document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>refine(b.dataset.r));
$("#undo").onclick=()=>{if(versions.length){$("#out").textContent=versions.pop();$("#undo").disabled=!versions.length}};
function showImg(out){
 const box=$("#imgBox");if(cur!=="image"||cfg.img!=="1"){box.classList.add("hide");return}
 const ps=[...out.matchAll(/(?:프롬프트|prompt)[^:：\n]*[:：]\s*(.+)/gi)].map(m=>m[1].replace(/[*"`]/g,"").trim());
 if(!ps.length){box.classList.add("hide");return}
 box.classList.remove("hide");
 box.innerHTML=`<div class="row">`+ps.slice(0,3).map(p=>`<a href="https://image.pollinations.ai/prompt/${encodeURIComponent(p)}" target="_blank"><img style="width:150px;border-radius:8px" src="https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=512&height=512&nologo=true" alt=""></a>`).join("")+`</div>`;
}

/* 입력: 드래그앤드랍 / 링크 */
const inCard=$("#inCard"),inp=$("#input");
["dragenter","dragover"].forEach(e=>inCard.addEventListener(e,ev=>{ev.preventDefault();inCard.classList.add("drop")}));
["dragleave","drop"].forEach(e=>inCard.addEventListener(e,ev=>{ev.preventDefault();inCard.classList.remove("drop")}));
inCard.addEventListener("drop",async ev=>{
 const f=ev.dataTransfer.files[0];
 if(f){inp.value+=(inp.value?"\n\n":"")+await f.text();return}
 const t=ev.dataTransfer.getData("text/plain");if(t)inp.value+=(inp.value?"\n\n":"")+t;
});
$("#fetchUrl").onclick=async()=>{
 const m=inp.value.match(/https?:\/\/\S+/);if(!m){$("#out").textContent="입력창에 URL을 붙여넣으세요.";return}
 $("#out").textContent="본문 가져오는 중…";
 try{const r=await fetch("https://r.jina.ai/"+m[0]);if(!r.ok)throw new Error(r.status);const t=await r.text();inp.value=inp.value.replace(m[0],"\n[원문 자료]\n"+t.slice(0,8000));$("#out").textContent="링크 본문을 입력창에 넣었습니다. 작성/수정을 눌러주세요."}
 catch(e){$("#out").innerHTML=`<span class="err">링크를 가져오지 못했습니다(${esc(e.message)}). 본문을 직접 붙여넣어 주세요.</span>`}
};
$("#clearIn").onclick=()=>inp.value="";
$("#copy").onclick=()=>navigator.clipboard.writeText($("#out").innerText);
$("#toIn").onclick=()=>inp.value=$("#out").innerText;

/* 뉴스 */
async function loadNews(){
 const kws=$("#kw").value.split(",").map(s=>s.trim()).filter(Boolean);if(!kws.length)return;
 const box=$("#newsList");box.textContent="수집 중…";let html="";
 for(const k of kws){
  try{
   const u="https://news.google.com/rss/search?q="+encodeURIComponent(k)+"&hl=ko&gl=KR&ceid=KR:ko";
   const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(u));const j=await r.json();
   html+=`<h3>${esc(k)}</h3><ul>`+(j.items||[]).slice(0,6).map(i=>`<li><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a><br><small>${esc((i.pubDate||"").slice(0,10))}</small> <button class="btn sm" data-t="${esc(i.title)}" data-l="${esc(i.link)}">이 기사로 링크드인 글쓰기</button></li>`).join("")+"</ul>";
  }catch(e){html+=`<p class="err">${esc(k)}: 수집 실패 (${esc(e.message)})</p>`}
 }
 box.innerHTML=html;
 box.querySelectorAll("button[data-t]").forEach(b=>b.onclick=()=>{cur="linkedin";LS.set("cur",cur);render();inp.value=`다음 기사를 내 관점의 인사이트로 풀어 글을 써줘.\n제목: ${b.dataset.t}\n${b.dataset.l}`;});
}
$("#kwGo").onclick=loadNews;$("#kwSave").onclick=()=>{cfg.kw=$("#kw").value;save();$("#state").textContent="키워드 저장됨"};

/* 설정 / 백업 */
function openSet(){$("#sKey").value=cfg.key;$("#sModel").value=cfg.model;$("#sProfile").value=cfg.profile;$("#sImg").value=cfg.img;$("#dlg").showModal()}
$("#sCancel").onclick=()=>$("#dlg").close();
$("#sSave").onclick=()=>{cfg.key=$("#sKey").value.trim();cfg.model=$("#sModel").value.trim()||"claude-sonnet-5-5";cfg.profile=$("#sProfile").value;cfg.img=$("#sImg").value;save();$("#dlg").close();render()};
$("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({hist:history,kw:cfg.kw,profile:cfg.profile},null,1)],{type:"application/json"}));a.download="글쓰기스튜디오_백업_"+new Date().toISOString().slice(0,10)+".json";a.click()};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());const ids=new Set(history.map(h=>h.id));history=[...history,...(j.hist||[]).filter(h=>!ids.has(h.id))].sort((a,b)=>b.t-a.t);if(j.kw)cfg.kw=j.kw;if(j.profile)cfg.profile=j.profile;save();render()}catch{alert("백업 파일을 읽지 못했습니다.")}};
$("#clr").onclick=()=>{if(confirm("이 메뉴의 작업 기록을 삭제할까요?")){history=history.filter(h=>h.cat!==cur);save();renderHist()}};
render();
</script>
</body>
</html>
